    <script>
// Diğer sayfalarda da çalışması için eklenen kayıt kodu
async function kayitOl() {
    const kullaniciAdi = prompt("F1 Bilet Sistemi - Kullanıcı Adı Belirleyin:");
    if (!kullaniciAdi || kullaniciAdi.trim() === "") return;
    const eposta = prompt("E-posta Adresinizi Girin:");
    if (!eposta || eposta.trim() === "") return;
    const sifre = prompt("Şifrenizi Belirleyin:");
    if (!sifre || sifre.trim() === "") return;

    try {
        const response = await fetch('http://localhost:5057/api/kayit-ol', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kullaniciAdi: kullaniciAdi, eposta: eposta, sifre: sifre })
        });
        const sonuc = await response.json();
        if (response.ok) {
            alert(`🎉 ${sonuc.mesaj}\nArtık belirlediğiniz bilgilerle giriş yapabilirsiniz.`);
        } else {
            alert(`⚠️ Kayıt Hatası: ${sonuc.hata}`);
        }
    } catch (error) {
        alert("Sistem hatası: API ile bağlantı kurulamadı!");
    }
}

async function girisYap() {
    const kullaniciAdi = prompt("Kullanıcı Adınız:");
    if (!kullaniciAdi || kullaniciAdi.trim() === "") return;
    const sifre = prompt("Şifreniz:");
    if (!sifre || sifre.trim() === "") return;

    try {
        const response = await fetch('http://localhost:5057/api/giris-yap', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kullaniciAdi: kullaniciAdi, sifre: sifre })
        });
        const sonuc = await response.json();
        if (response.ok) {
            alert(sonuc.mesaj); 
            localStorage.setItem("aktifKullanici", sonuc.kullaniciAdi);
        } else {
            alert(`⚠️ Giriş Başarısız: ${sonuc.hata}`);
        }
    } catch (error) {
        alert("Sistem hatası: API ile bağlantı kurulamadı!");
    }
}
</script>
