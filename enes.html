<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F1 Ticket Reservation</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:white;
    font-family:'Orbitron', sans-serif;
    overflow-x:hidden;
}


.navbar{
    width:100%;
    height:80px;
    background:#111;
    border-bottom:3px solid #e10600;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 60px;
}

.logo{
    font-size:30px;
    color:#e10600;
    font-weight:700;
}

.nav-links{
    display:flex;
    gap:35px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    transition:0.3s;
    font-size:14px;
}

.nav-links a:hover{
    color:#e10600;
}


.hero{
    position:relative;

    width:100%;
    height:500px;

    background:
    linear-gradient(to right,
    rgba(0,0,0,0.85),
    rgba(0,0,0,0.3)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070');

    background-size:cover;
    background-position:center;
}

.hero-content{
    position:absolute;
    top:50%;
    left:80px;

    transform:translateY(-50%);
}

.hero h1{
    font-size:70px;
    margin-bottom:20px;
}

.hero p{
    width:550px;
    color:#ddd;
    line-height:1.7;
    font-size:15px;
}


.ticket-box{

    position:absolute;

    top:50%;
    right:80px;

    transform:translateY(-50%);

    width:430px;

    background:white;
    color:black;

    border-radius:22px;

    padding:35px;

    box-shadow:
    0 0 40px rgba(0,0,0,0.5);

}

.ticket-box h2{
    color:#111;
    margin-bottom:25px;
    font-size:30px;
}

.ticket-box select,
.ticket-box input{

    width:100%;

    padding:15px;

    margin-bottom:18px;

    border-radius:10px;

    border:1px solid #ccc;

    font-family:'Orbitron', sans-serif;
}

.ticket-box button{

    width:100%;

    padding:16px;

    background:#e10600;

    color:white;

    border:none;

    border-radius:12px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.ticket-box button:hover{
    background:#ff1f1f;
}

.ticket-info{
    margin-bottom:15px;
    font-size:14px;
    color:#555;
}

.capacity{
    color:#0ba84f;
    font-weight:bold;
}


#reservationPanel{

    position:fixed;

    top:0;
    right:-500px;

    width:500px;
    height:100vh;

    background:#101010;

    border-left:4px solid #e10600;

    padding:35px;

    overflow-y:auto;

    transition:0.4s;

    z-index:999;
}

#reservationPanel.active{
    right:0;
}

.close-btn{

    position:absolute;

    right:25px;
    top:20px;

    background:none;
    border:none;

    color:white;

    font-size:28px;

    cursor:pointer;
}

.panel-title{
    margin-top:20px;
    margin-bottom:20px;
}

.timer{

    background:#1d1d1d;

    color:#ffd000;

    text-align:center;

    padding:15px;

    border-radius:10px;

    margin-bottom:20px;
}

.person-card{

    background:#181818;

    padding:20px;

    border-radius:14px;

    margin-top:20px;
}

.reservation-title{
    margin-bottom:18px;
    font-size:20px;
}

.person-card input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:none;

    border-radius:10px;

    background:#232323;

    color:white;

    font-family:'Orbitron', sans-serif;
}

.purchase-btn{

    width:100%;

    padding:16px;

    background:#e10600;

    border:none;

    color:white;

    border-radius:12px;

    margin-top:25px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}


@media(max-width:1100px){

    .hero{
        height:auto;
        padding-bottom:50px;
    }

    .hero-content{
        position:relative;
        top:auto;
        left:auto;
        transform:none;

        padding:60px 30px;
    }

    .ticket-box{

        position:relative;

        top:auto;
        right:auto;

        transform:none;

        margin:0 auto;
    }

}

@media(max-width:600px){

    .ticket-box{
        width:90%;
    }

    .hero h1{
        font-size:42px;
    }

    .hero p{
        width:100%;
    }

    #reservationPanel{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">F1</div>

    <div class="nav-links">
        <a href="#">Schedule</a>
        <a href="#">Teams</a>
        <a href="#">Drivers</a>
        <a href="#">News</a>
        <a href="#">Tickets</a>
    </div>

</div>

<!-- HERO -->

<div class="hero">

    <div class="hero-content">

        <h1>FORMULA 1<br>2026 SEASON</h1>

        <p>
            Experience the speed, adrenaline and excitement of Formula 1.
            Reserve your place now for the most iconic race weekends
            around the world.
        </p>

    </div>

    <!-- TICKET BOX -->

    <div class="ticket-box">

        <h2>BUY TICKETS</h2>

        <select id="trackSelect" onchange="updateTrackInfo()">
            <option value="0">Monaco Grand Prix</option>
            <option value="1">Silverstone</option>
            <option value="2">Spa-Francorchamps</option>
        </select>

        <div class="ticket-info" id="trackDate">
            Race Date: 12 June 2026
        </div>

        <div class="ticket-info">
            Remaining Tickets:
            <span class="capacity" id="trackCapacity">
                43
            </span>
        </div>

        <input
        type="number"
        id="ticketCount"
        placeholder="How many tickets?"
        min="1"
        max="10">

        <button onclick="startReservation()">
            CONTINUE
        </button>

    </div>

</div>

<!-- RESERVATION PANEL -->

<div id="reservationPanel">

    <button class="close-btn" onclick="closePanel()">×</button>

    <h2 class="panel-title">
        Ticket Reservation
    </h2>

    <div class="timer" id="timer">
        15:00
    </div>

    <div id="formsContainer"></div>

</div>

<script>

const tracks = [

{
    name:"Monaco Grand Prix",
    date:"12 June 2026",
    capacity:43
},

{
    name:"Silverstone",
    date:"03 July 2026",
    capacity:68
},

{
    name:"Spa-Francorchamps",
    date:"20 August 2026",
    capacity:37
}

];

let selectedTrack = tracks[0];

let timer;
let timeLeft = 900;

let reservedTicketCount = 0;

function updateTrackInfo(){

    const index =
    document.getElementById("trackSelect").value;

    selectedTrack = tracks[index];

    document.getElementById("trackDate")
    .innerText =
    `Race Date: ${selectedTrack.date}`;

    document.getElementById("trackCapacity")
    .innerText =
    selectedTrack.capacity;

}

function startReservation(){

    const count =
    parseInt(document.getElementById("ticketCount").value);

    if(!count || count <= 0){

        alert("Please enter valid ticket count!");

        return;

    }

    if(count > selectedTrack.capacity){

        alert("Not enough tickets remaining!");

        return;

    }

    reservedTicketCount = count;

    selectedTrack.capacity -= count;

    document.getElementById("trackCapacity")
    .innerText =
    selectedTrack.capacity;

    document.getElementById("reservationPanel")
    .classList.add("active");

    createPassengerForms(count);

    startTimer();

}

function createPassengerForms(count){

    const container =
    document.getElementById("formsContainer");

    container.innerHTML = "";

    for(let i=1; i<=count; i++){

        container.innerHTML += `

        <div class="person-card">

            <h3 class="reservation-title">
                Reservation ${i}
            </h3>

            <input
            type="text"
            placeholder="Name"
            id="name-${i}">

            <input
            type="text"
            placeholder="Surname"
            id="surname-${i}">

            <input
            type="text"
            value="__/__/____"
            maxlength="10"
            id="birth-${i}"
            onkeydown="handleDateInput(event, this)">

        </div>

        `;

    }

    container.innerHTML += `

    <button
    class="purchase-btn"
    onclick="completePurchase(${count})">

        COMPLETE PURCHASE

    </button>

    `;

}

function startTimer(){

    clearInterval(timer);

    timeLeft = 900;

    timer = setInterval(() => {

        timeLeft--;

        const minutes =
        Math.floor(timeLeft / 60);

        const seconds =
        timeLeft % 60;

        document.getElementById("timer")
        .innerText =
        `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

        if(timeLeft <= 0){

            clearInterval(timer);

            resetReservation();

            alert("Reservation expired!");

        }

    },1000);

}

function closePanel(){

    const confirmClose = confirm(
        "Are you sure? Your progress won't be saved."
    );

    if(confirmClose){

        resetReservation();

    }

}

function resetReservation(){

    clearInterval(timer);

    selectedTrack.capacity += reservedTicketCount;

    document.getElementById("trackCapacity")
    .innerText =
    selectedTrack.capacity;

    reservedTicketCount = 0;

    document.getElementById("formsContainer")
    .innerHTML = "";

    document.getElementById("ticketCount")
    .value = "";

    document.getElementById("reservationPanel")
    .classList.remove("active");

}

function completePurchase(count){

    for(let i=1; i<=count; i++){

        const name =
        document.getElementById(`name-${i}`).value;

        const surname =
        document.getElementById(`surname-${i}`).value;

        const birthDate =
        document.getElementById(`birth-${i}`).value;

        if(!name || !surname || birthDate.includes("_")){

            alert("Please fill all fields!");

            return;

        }

        const age =
        calculateAge(birthDate);

        if(age < 13){

            alert(`Reservation ${i} is under 13!`);

            return;

        }

    }

    clearInterval(timer);

    reservedTicketCount = 0;

    alert("Purchase completed successfully!");

    document.getElementById("formsContainer")
    .innerHTML = "";

    document.getElementById("ticketCount")
    .value = "";

    document.getElementById("reservationPanel")
    .classList.remove("active");

}

function calculateAge(dateString){

    const parts =
    dateString.split("/");

    const day =
    parseInt(parts[0]);

    const month =
    parseInt(parts[1]) - 1;

    const year =
    parseInt(parts[2]);

    const birthDate =
    new Date(year, month, day);

    const today =
    new Date();

    let age =
    today.getFullYear() -
    birthDate.getFullYear();

    const monthDifference =
    today.getMonth() -
    birthDate.getMonth();

    if(
        monthDifference < 0 ||
        (
            monthDifference === 0 &&
            today.getDate() <
            birthDate.getDate()
        )
    ){
        age--;
    }

    return age;

}

function handleDateInput(event, input){

    event.preventDefault();

    let value = input.value;

    if(event.key >= '0' && event.key <= '9'){

        for(let i=0; i<value.length; i++){

            if(value[i] === '_'){

                value =
                value.substring(0, i) +
                event.key +
                value.substring(i + 1);

                break;

            }

        }

    }

    if(event.key === 'Backspace'){

        for(let i=value.length - 1; i>=0; i--){

            if(
                value[i] !== '_' &&
                value[i] !== '/'
            ){

                value =
                value.substring(0, i) +
                '_' +
                value.substring(i + 1);

                break;

            }

        }

    }

    input.value = value;

}

</script>

</body>
</html>
