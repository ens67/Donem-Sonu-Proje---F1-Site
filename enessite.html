<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F1 Ticket Reservation</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0c0c0c;
    color:white;
    font-family:'Orbitron', sans-serif;
}


.navbar{
    width:100%;
    height:80px;
    background:#111;
    border-bottom:3px solid #e10600;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#e10600;
}

.nav-links{
    display:flex;
    gap:30px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.nav-links a:hover{
    color:#e10600;
}


.hero{
    width:100%;
    height:350px;

    background:
    linear-gradient(to right, rgba(0,0,0,0.85), rgba(0,0,0,0.3)),
    url('https://drahmetakcay.com/wp-content/uploads/2021/12/Tavsan-Alerjisi.jpg.webp');

    background-size:cover;
    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-left:80px;
}

.hero h1{
    font-size:60px;
    color:white;
    margin-bottom:15px;
}

.hero p{
    color:#ccc;
    width:500px;
    line-height:1.6;
}


.section-title{
    margin:50px 80px 30px;
    font-size:32px;
}


.track-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:30px;

    padding:0 80px 80px;
}


.track-card{
    background:#151515;
    border-radius:18px;
    overflow:hidden;

    border-top:4px solid #e10600;

    transition:0.3s;
}

.track-card:hover{
    transform:translateY(-8px);
}

.track-image{
    width:100%;
    height:200px;
    object-fit:cover;
}

.track-content{
    padding:25px;
}

.track-content h2{
    margin-bottom:15px;
}

.track-info{
    margin-bottom:10px;
    color:#bbb;
    font-size:14px;
}

.capacity{
    color:#00ff95;
}

.price{
    color:#fff;
    font-size:22px;
    margin:20px 0;
}

.reserve-btn{
    width:100%;
    padding:14px;

    background:#e10600;
    border:none;

    color:white;
    font-size:15px;
    font-weight:bold;

    border-radius:10px;

    cursor:pointer;

    transition:0.3s;
}

.reserve-btn:hover{
    background:#ff1f1f;
}


#reservationPanel{
    position:fixed;

    top:0;
    right:-500px;

    width:500px;
    height:100vh;

    background:#101010;

    border-left:3px solid #e10600;

    padding:35px;

    overflow-y:auto;

    transition:0.4s;

    z-index:999;
}

#reservationPanel.active{
    right:0;
}

.close-btn{
    background:none;
    border:none;
    color:white;
    font-size:28px;
    cursor:pointer;

    position:absolute;
    right:25px;
    top:20px;
}

.panel-title{
    margin-top:20px;
    margin-bottom:20px;
}

.timer{
    background:#1f1f1f;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;

    color:#ffd000;
    text-align:center;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;

    border:none;
    border-radius:10px;

    background:#1c1c1c;
    color:white;

    font-family:'Orbitron', sans-serif;
    font-size:15px;
}

.person-card{
    background:#171717;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
}

.reservation-title{
    margin-bottom:18px;
    font-size:20px;
    color:#fff;
}

.purchase-btn{
    width:100%;
    padding:16px;

    background:#e10600;
    border:none;

    color:white;
    font-size:16px;
    font-weight:bold;

    border-radius:10px;

    margin-top:25px;

    cursor:pointer;
}


@media(max-width:768px){

    .hero{
        padding:40px;
    }

    .hero h1{
        font-size:38px;
    }

    .hero p{
        width:100%;
    }

    .track-grid{
        padding:20px;
    }

    .section-title{
        margin:40px 20px 20px;
    }

    #reservationPanel{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">F1 TICKETS</div>

    <div class="nav-links">
        <a href="#">Schedule</a>
        <a href="#">Teams</a>
        <a href="#">Tickets</a>
        <a href="#">Drivers</a>
    </div>

</div>

<!-- HERO -->

<div class="hero">

    <h1>2026 GRAND PRIX TICKETS</h1>

    <p>
        Reserve your seats for the highly awaited Formula 1 circuits.
    </p>

</div>

<h1 class="section-title">Upcoming Races</h1>

<!-- TRACKS -->

<div class="track-grid" id="trackGrid"></div>

<!-- RESERVATION PANEL -->

<div id="reservationPanel">

    <button class="close-btn" onclick="closePanel()">×</button>

    <h2 class="panel-title">Ticket Reservation</h2>

    <div class="timer" id="timer">
        15:00
    </div>

    <input
    type="number"
    id="ticketCount"
    placeholder="How many tickets?"
    min="1"
    max="10">

    <button
    class="reserve-btn"
    onclick="createPassengerForms()">

        Continue

    </button>

    <div id="formsContainer"></div>

</div>

<script>

const tracks = [

{
    id:1,
    name:"Monaco Grand Prix",
    date:"12 June 2026",
    capacity:43,
    price:500,
    image:"https://i.pinimg.com/originals/42/6d/63/426d636fd2f96cc18f49078004938966.jpg"
},

{
    id:2,
    name:"Silverstone",
    date:"03 July 2026",
    capacity:68,
    price:420,
    image:"https://cdn.shopify.com/s/files/1/0054/5072/7489/products/the-roadrunner-comic-book-animation-or-warner-bros-cartoonsproduct-type_2400x.jpg"
},

{
    id:3,
    name:"Spa-Francorchamps",
    date:"20 August 2026",
    capacity:37,
    price:580,
    image:"https://i.ytimg.com/vi/cnwENYcVniI/hqdefault.jpg"
}

];

const grid = document.getElementById("trackGrid");

let selectedTrack = null;

let timer;
let timeLeft = 900;

let reservedTicketCount = 0;

tracks.forEach(track => {

    grid.innerHTML += `

    <div class="track-card">

        <img src="${track.image}" class="track-image">

        <div class="track-content">

            <h2>${track.name}</h2>

            <div class="track-info">
                Race Date: ${track.date}
            </div>

            <div class="track-info">
                Remaining Tickets:
                <span class="capacity" id="capacity-${track.id}">
                    ${track.capacity}
                </span>
            </div>

            <div class="price">
                ${track.price}$
            </div>

            <button
            class="reserve-btn"
            onclick="openReservation(${track.id})">

                Reserve Ticket

            </button>

        </div>

    </div>

    `;

});

function openReservation(id){

    selectedTrack = tracks.find(t => t.id === id);

    if(selectedTrack.capacity <= 0){
        alert("No tickets left!");
        return;
    }

    document.getElementById("reservationPanel")
    .classList.add("active");

    document.getElementById("formsContainer").innerHTML = "";

    document.getElementById("ticketCount").value = "";

    startTimer();

}

function closePanel(){

    document.getElementById("reservationPanel")
    .classList.remove("active");

}

function startTimer(){

    clearInterval(timer);

    timeLeft = 900;

    timer = setInterval(() => {

        timeLeft--;

        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;

        document.getElementById("timer").innerText =
        `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

        if(timeLeft <= 0){

            clearInterval(timer);

            selectedTrack.capacity += reservedTicketCount;

            document.getElementById(
                `capacity-${selectedTrack.id}`
            ).innerText = selectedTrack.capacity;

            alert("Reservation expired!");

            reservedTicketCount = 0;

            closePanel();

        }

    },1000);

}

function createPassengerForms(){

    const count =
    parseInt(document.getElementById("ticketCount").value);

    if(!count || count <= 0){
        alert("Please enter valid ticket count!");
        return;
    }

    if(count > selectedTrack.capacity){

        alert("Not enough tickets remaining!");

        return;

    }

    reservedTicketCount = count;

    selectedTrack.capacity -= count;

    document.getElementById(
        `capacity-${selectedTrack.id}`
    ).innerText = selectedTrack.capacity;

    const container =
    document.getElementById("formsContainer");

    container.innerHTML = "";

    for(let i=1; i<=count; i++){

        container.innerHTML += `

        <div class="person-card">

            <h3 class="reservation-title">
                Reservation ${i}
            </h3>

            <input
            type="text"
            placeholder="Name"
            id="name-${i}">

            <input
            type="text"
            placeholder="Surname"
            id="surname-${i}">

            <input
            type="text"
            value="__/__/____"
            maxlength="10"
            id="birth-${i}"
            onkeydown="handleDateInput(event, this)">

        </div>

        `;

    }

    container.innerHTML += `

    <button
    class="purchase-btn"
    onclick="completePurchase(${count})">

        Complete Purchase

    </button>

    `;

}

function completePurchase(count){

    for(let i=1; i<=count; i++){

        const name =
        document.getElementById(`name-${i}`).value;

        const surname =
        document.getElementById(`surname-${i}`).value;

        const birthDate =
        document.getElementById(`birth-${i}`).value;

        if(!name || !surname || birthDate.includes("_")){

            alert("Please fill all fields!");

            return;

        }

        const age = calculateAge(birthDate);

        if(age < 13){

            alert(`Reservation ${i} is under 13!`);

            return;

        }

    }

    clearInterval(timer);

    reservedTicketCount = 0;

    alert("Purchase completed successfully!");

    closePanel();

}

function calculateAge(dateString){

    const parts = dateString.split("/");

    if(parts.length !== 3){
        return -1;
    }

    const day = parseInt(parts[0]);
    const month = parseInt(parts[1]) - 1;
    const year = parseInt(parts[2]);

    const birthDate = new Date(year, month, day);

    const today = new Date();

    let age =
    today.getFullYear() - birthDate.getFullYear();

    const monthDifference =
    today.getMonth() - birthDate.getMonth();

    if(
        monthDifference < 0 ||
        (
            monthDifference === 0 &&
            today.getDate() < birthDate.getDate()
        )
    ){
        age--;
    }

    return age;

}

function handleDateInput(event, input){

    event.preventDefault();

    let value = input.value;

    if(event.key >= '0' && event.key <= '9'){

        for(let i = 0; i < value.length; i++){

            if(value[i] === '_'){

                value =
                value.substring(0, i) +
                event.key +
                value.substring(i + 1);

                break;
            }

        }

    }

    if(event.key === 'Backspace'){

        for(let i = value.length - 1; i >= 0; i--){

            if(value[i] !== '_' && value[i] !== '/'){

                value =
                value.substring(0, i) +
                '_' +
                value.substring(i + 1);

                break;
            }

        }

    }

    input.value = value;

}

</script>

</body>
</html>
