.navbar .d-flex {
    height: 100%;

.hero{

    width:100%;
    height:420px;

    position:relative;

    overflow:hidden;

}

.hero img{

    width:100%;
    height:100%;
    object-fit:cover;

    filter:brightness(0.55);

}

.hero-overlay{

    position:absolute;

    top:50%;
    left:80px;

    transform:translateY(-50%);

    background:rgba(0,0,0,0.45);

    backdrop-filter:blur(6px);

    border-radius:18px;

    padding:35px;

    width:520px;

}

.hero-overlay h1{

    font-size:48px;

}

.hero-overlay p{

    color:#ccc;
    line-height:1.6;

}


.section-title{

    margin:50px 80px 30px;
    font-size:34px;

}


.track-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

    gap:30px;

    padding:0 80px 80px;

}


.track-card{

    background:#151515;

    border-radius:18px;

    overflow:hidden;

    border-top:4px solid #e10600;

    transition:0.3s;

    box-shadow:0 0 18px rgba(0,0,0,0.3);

}

.track-card:hover{

    transform:translateY(-8px);

    box-shadow:0 0 30px rgba(225,6,0,0.25);

}

.track-image{

    width:100%;
    height:220px;

    object-fit:cover;

}

.track-content{

    padding:25px;

}

.track-content h2{

    margin-bottom:15px;
    font-size:24px;

}

.track-info{

    margin-bottom:10px;
    color:#bbb;
    font-size:14px;

}

.capacity{

    color:#00ff95;
    font-weight:bold;

}

.price{

    font-size:28px;
    margin:20px 0;
    font-weight:700;

}


.reserve-btn{

    width:100%;

    padding:14px;

    background:#e10600;

    border:none;

    color:white;

    font-size:15px;

    font-weight:bold;

    border-radius:10px;

    cursor:pointer;

    transition:0.3s;

}

.reserve-btn:hover{

    background:#ff1f1f;

}


#reservationPanel{

    position:fixed;

    top:0;
    right:-520px;

    width:520px;
    height:100vh;

    background:#101010;

    border-left:3px solid #e10600;

    padding:35px;

    overflow-y:auto;

    transition:0.4s;

    z-index:999;

}

#reservationPanel.active{

    right:0;

}

.close-btn{

    background:none;

    border:none;

    color:white;

    font-size:30px;

    cursor:pointer;

    position:absolute;

    top:20px;
    right:25px;

}

.panel-title{

    margin-top:20px;
    margin-bottom:20px;

}

.timer{

    background:#1b1b1b;

    padding:16px;

    border-radius:10px;

    margin-bottom:20px;

    text-align:center;

    color:#ffd000;

    font-weight:bold;

}

input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:none;

    border-radius:10px;

    background:#1b1b1b;

    color:white;

    font-family:'Orbitron', sans-serif;

    outline:none;

}

.person-card{

    background:#171717;

    padding:20px;

    border-radius:12px;

    margin-top:20px;

}

.reservation-title{

    margin-bottom:18px;

    font-size:20px;

}

.purchase-btn{

    width:100%;

    padding:15px;

    background:#e10600;

    border:none;

    color:white;

    font-weight:bold;

    border-radius:10px;

    margin-top:25px;

    cursor:pointer;

    transition:0.3s;

}

.purchase-btn:hover{

    background:#ff1f1f;

}


@media(max-width:768px){

    .hero-overlay{

        width:80%;
        left:10%;
        padding:25px;

    }

    .hero-overlay h1{

        font-size:32px;

    }

    .track-grid{

        padding:20px;

    }

    .section-title{

        margin:40px 20px 20px;

    }

    #reservationPanel{

        width:100%;
        right:-100%;

    }

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-md py-0" style="background-color: rgb(86, 86, 86);">

        <a href="takimlarnew.html" class="navbar-brand" style="padding-right: 5%;">

    <ul class="navbar-nav nav-fill deneme mx-auto">
        <li class="nav-item d-flex align-items-center navbaricon">
            <a href="takimlarnew.html" class="nav-link text-white renk" style="letter-spacing: 0.5px;">TAKIMLAR</a>
        </li>                    
        <li class="nav-item d-flex align-items-center navbaricon">
            <a href="pilotlar.html" class="nav-link text-white renk" style="letter-spacing: 0.5px;">PILOTLAR</a>
        </li>
        <li class="nav-item d-flex align-items-center navbaricon">
            <a href="takvimyeni.html" class="nav-link text-white renk" style="letter-spacing: 0.5px;">TAKVIM</a>
        </li>
        <li class="nav-item d-flex align-items-center navbaricon">
            <a href="#trackGrid" class="nav-link renk" style="letter-spacing: 0.5px; color: white;">BILETLER</a>
        </li>
    </ul>
    
    <div class="d-flex align-items-center justify-content-center gap-3 ms-md-auto py-3 py-md-0 pe-md-4">
        <a href="javascript:void(0);" onclick="girisYap()" class="btn btn-outline-light btn-sm px-3 py-2" style="font-family: 'Orbitron', sans-serif;">Giriş Yap</a>

        <a href="javascript:void(0);" onclick="kayitOl()" class="btn btn-register btn-sm px-3 py-2 text-white" style="background-color: #e10600; font-family: 'Orbitron', sans-serif;">Kayıt Ol</a>
    </div>
</div>
    </div>
</nav>

<div class="hero">

<img src="Qhn5UrhFS1uCKz98tjnXEQ.webp">

<div class="hero-overlay">

    <h1>
        2026 GRAND PRIX
    </h1>

    <p>
        Motor sesini hisset,
        hızın merkezine biletini al.
    </p>

</div>

</div>

<h1 class="section-title">
    Upcoming Races
</h1>

<div class="track-grid" id="trackGrid"></div>

<div id="reservationPanel">

<button class="close-btn" onclick="closePanel()">
    ×
</button>

<h2 class="panel-title">
    Ticket Reservation
</h2>

<div class="timer" id="timer">
    15:00
</div>

<input
type="number"
id="ticketCount"
placeholder="How many tickets?"
min="1"
max="10">

<button
class="reserve-btn"
onclick="createPassengerForms()">

    Continue

</button>

<div id="formsContainer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

const tracks = [];

    document.addEventListener("DOMContentLoaded", function() {
        yarisleriGetir();
    });

async function kayitOl() {
    const kullaniciAdi = prompt("F1 Bilet Sistemi - Kullanıcı Adı Belirleyin:");
    if (!kullaniciAdi || kullaniciAdi.trim() === "") return;

    const eposta = prompt("E-posta Adresinizi Girin:");
    if (!eposta || eposta.trim() === "") return;

    const sifre = prompt("Şifrenizi Belirleyin:");
    if (!sifre || sifre.trim() === "") return;

    try {
        const response = await fetch('http://localhost:5057/api/kayit-ol', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kullaniciAdi: kullaniciAdi, eposta: eposta, sifre: sifre })
        });

        const sonuc = await response.json();

        if (response.ok) {
            alert(`🎉 ${sonuc.mesaj}\nArtık belirlediğiniz bilgilerle giriş yapabilirsiniz.`);
        } else {
            alert(`⚠️ Kayıt Hatası: ${sonuc.hata}`);
        }
    } catch (error) {
        alert("Sistem hatası: API ile bağlantı kurulamadı!");
    }
}

async function girisYap() {
    const kullaniciAdi = prompt("Kullanıcı Adınız:");
    if (!kullaniciAdi || kullaniciAdi.trim() === "") return;

    const sifre = prompt("Şifreniz:");
    if (!sifre || sifre.trim() === "") return;

    try {
        const response = await fetch('http://localhost:5057/api/giris-yap', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kullaniciAdi: kullaniciAdi, sifre: sifre })
        });

        const sonuc = await response.json();

        if (response.ok) {
            alert(sonuc.mesaj); 
            
            localStorage.setItem("aktifKullanici", sonuc.kullaniciAdi);
        } else {
            alert(`⚠️ Giriş Başarısız: ${sonuc.hata}`);
        }
    } catch (error) {
        alert("Sistem hatası: API ile bağlantı kurulamadı!");
    }
}

    async function yarisleriGetir() {
    try {
        const response = await fetch('http://localhost:5057/api/yarislar');
        const yarislar = await response.json();
        
        const trackGrid = document.getElementById("trackGrid"); 
        if(!trackGrid) return;
        
        trackGrid.innerHTML = "";

        yarislar.forEach(yaris => {
            trackGrid.innerHTML += `
    <div class="col">
        <div class="card h-100 bg-dark text-white border-0 shadow-lg" 
             style="border-radius: 20px; overflow: hidden; background: linear-gradient(145deg, #111, #000);">
            
            <div style="height: 300px; background-color: #222; display: flex; align-items: center; justify-content: center;">
                <img src="${yaris.resim || 'placeholder.jpg'}" 
                     class="card-img-top h-100 w-100" 
                     alt="${yaris.ad}" 
                     style="object-fit: cover; opacity: 0.7;">
            </div>

            <div class="card-body d-flex flex-column text-center" style="padding: 25px 20px;">
                
                <h5 class="card-title text-danger fw-bold mt-3" 
                    style="font-family: 'Orbitron', sans-serif; letter-spacing: 1.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase;">
                    ${yaris.ad}
                </h5>
                <p class="card-text text-secondary mb-3 small" style="font-family: 'Orbitron', sans-serif;">
                    <i class="fa-regular fa-calendar-days me-2"></i> ${yaris.tarih}
                </p>
                
                <div class="d-flex justify-content-center align-items-center gap-3 mb-4" style="font-family: 'Orbitron', sans-serif;">
                    
                    <span class="badge ${yaris.kapasite > 0 ? 'bg-success' : 'bg-danger'} rounded-pill px-3 py-2 d-inline-flex align-items-center justify-content-center" 
                          style="font-family: 'Orbitron', sans-serif; line-height: 1;">
                        ${yaris.kapasite > 0 ? 'Mevcut: ' + yaris.kapasite : 'Tükendi'}
                    </span>
                    
                    <span class="fs-4 fw-bold text-white" style="font-family: 'Orbitron', sans-serif;">$${yaris.fiyat}</span>
                </div>

                <button class="btn btn-danger btn-sm w-100 fw-bold mt-auto" 
                        style="background-color: #e10600; border: none; font-family: 'Orbitron', sans-serif; border-radius: 10px; padding: 10px; text-transform: uppercase; letter-spacing: 1px;"
                        onclick="biletSatinAl(${yaris.id}, '${yaris.ad}')" 
                        ${yaris.kapasite === 0 ? 'disabled' : ''}>
                    ${yaris.kapasite === 0 ? 'Tükendi' : 'Bilet Al'}
                </button>
            </div>
        </div>
    </div>
`;
        });
        
    } catch (error) {
        console.error("Backend bağlantı hatası:", error);
        const trackGrid = document.getElementById("trackGrid");
        if(trackGrid) {
            trackGrid.innerHTML = "<p class='text-white text-center w-100'>⚠️ C# API motoru çalışmıyor! Lütfen terminalden 'dotnet run' yapın.</p>";
        }
    }
}
    

    async function biletSatinAl(yarisId, yarisAdi) {
        const musteriAdi = prompt(`${yarisAdi} için bilet alacak kişinin adı ve soyadı:`);
        if (!musteriAdi || musteriAdi.trim() === "") return;

        try {
            const response = await fetch('http://localhost:5057/api/bilet-al', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ yarisId: yarisId, musteriAdi: musteriAdi })
            });

            const sonuc = await response.json();

            if (response.ok) {
                alert(`🎉 Tebrikler Sayın ${musteriAdi}!\nBiletiniz Başarıyla Onaylandı.\n🎫 Bilet Kodunuz: ${sonuc.biletKodu}`);
                yarisleriGetir(); 
            } else {
                alert(`⚠️ İşlem Başarısız: ${sonuc.hata}`);
            }
        } catch (error) {
            alert("Sistem hatası: API ile iletişim kurulamadı!");
        }
    }

</script>
